[workspace]
resolver = "2"
members = ["monitor", "agent", "common"]

[workspace.package]
version = "0.1.9"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

[profile.release]
opt-level = 2
lto = "thin"
strip = true
codegen-units = 1
