[package]
name = "monitor"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "monitor"
path = "src/main.rs"

[dependencies]
monitor-common = { path = "../common" }
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
axum = { version = "0.8", features = ["macros", "http1"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "net"] }
tower-http = { version = "0.7", features = ["trace", "cors"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
chrono.workspace = true
clap = { version = "4", features = ["derive", "env"] }
log = "0.4"
env_logger = "0.11"
sysinfo = "0.39"
