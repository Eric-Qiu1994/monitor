[package]
name = "agent"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "monitor-agent"
path = "src/main.rs"

[dependencies]
monitor-common = { path = "../common" }
sysinfo = "0.39"
ureq = { version = "3", default-features = false, features = ["rustls", "json", "socks-proxy"] }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
chrono.workspace = true
clap = { version = "4", features = ["derive", "env"] }
log = "0.4"
# 自更新时校验 sha256；tiny crate，default-features off 即可（不要 alloc prealloc）
sha2 = { version = "0.10", default-features = false }
env_logger = "0.11"
